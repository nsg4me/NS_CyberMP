name: 'Build'

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'port/**'

# NOTE: pnpm doesn't support command 'ci' for now.
#
#env:
#  IS_CI: true

jobs:
  windows:
    strategy:
      matrix:
        os: [windows-2022] # has Windows SDK 10.0.19041 (the build needs one below 10.0.26100)
        arch: [x64]
        mode: [releasedbg]

    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    steps:
      - uses: actions/checkout@v4

      - name: 'Checkout submodules'
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      # Restore/save split so installed packages are kept even when a later step fails (they take ~10 min to build)
      - name: 'Restore xmake dependencies'
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: ${{ runner.os }}-xmake-packages-${{ hashFiles('**/xmake.lua') }}
          restore-keys: |
            ${{ runner.os }}-xmake-packages-

      # Install pnpm for better disk/cache performance
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Fix long path issue
      - name: Setup pnpm
        run: pnpm config set virtual-store-dir-max-length=50

      # Install xmake
      - name: 'Setup xmake'
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.0.9 # Sync with cache key too. 3.0.9+ maps MSVC 14.44 to toolset v143 (2.9.6 picks a nonexistent v144)
          actions-cache-folder: '.xmake-cache' # This doesn't cache dependencies, only xmake itself
          actions-cache-key: ${{ runner.os }}-xmake-cache-3.0.9

      - name: 'Configure xmake and install dependencies'
        run: xmake config --arch=${{ matrix.arch }} --mode=${{ matrix.mode }} --vs_sdkver=10.0.19041.0 --yes

      - name: 'Save xmake dependencies'
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: ${{ runner.os }}-xmake-packages-${{ hashFiles('**/xmake.lua') }}

      # Build the game
      - name: 'Build with xmake'
        run: xmake -y

      # Install node
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: |
            code/launcher/pnpm-lock.yaml
            code/launcher/electron/pnpm-lock.yaml

      - name: 'Generate build'
        run: xmake install -o distrib

      - name: 'Package build'
        run: xmake pack

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/xpack/Cyberpunk Multiplayer/Artifacts.zip

      # The client plugin on its own, for quick in-game testing without the launcher
      - name: 'Upload client DLL'
        uses: actions/upload-artifact@v4
        with:
          name: client-dll
          path: |
            build/windows/x64/${{ matrix.mode }}/CyberpunkMP.dll
            build/windows/x64/${{ matrix.mode }}/CyberpunkMP.pdb
          if-no-files-found: warn

      # The mod folder (client DLL + assets) on its own, for the Linux package
      - name: 'Upload mod'
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: distrib/launcher/mod/

  linux:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        arch: [x64]
        mode: [release]

    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    steps:
    - uses: actions/checkout@v4

    - name: 'Checkout submodules'
      run: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git submodule sync --recursive
        git submodule update --init --force --recursive --depth=1

    # Install dependencies
    - name: 'Update apt repositories'
      run: sudo apt-get update

    # Install pnpm for better disk/cache performance
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    # Install xmake
    - name: 'Setup xmake'
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: branch@master

    # Update xmake repository (in order to have the file that will be cached)
    - name: 'Update xmake repository'
      run: xmake repo --update

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9

    # Setup compilation mode and install project dependencies
    - name: 'Configure xmake and install dependencies'
      continue-on-error: true
      run: timeout 30m xmake config --arch=${{ matrix.arch }} --mode=${{ matrix.mode }} --yes

    # Build the server
    - name: Build
      run: xmake -y

    - name: 'Install server'
      run: xmake install -o distrib

    - name: 'Upload server'
      uses: actions/upload-artifact@v4
      with:
        name: server-linux
        path: distrib/launcher/server/

  # Linux package: Linux launcher + Linux server + the mod (a Windows DLL the game loads through Proton)
  package-linux:
    needs: [windows, linux]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 'Build launcher'
        run: |
          cd code/launcher
          pnpm install
          pnpm run build
          cd electron
          pnpm install
          pnpm exec electron-builder --linux dir --publish=never

      - uses: actions/download-artifact@v4
        with:
          name: mod
          path: package/CyberpunkMP/mod

      - uses: actions/download-artifact@v4
        with:
          name: server-linux
          path: package/CyberpunkMP/server

      - name: 'Assemble'
        run: |
          cp -r code/launcher/electron/out/linux-unpacked/. package/CyberpunkMP/
          chmod +x package/CyberpunkMP/cyberpunkmp package/CyberpunkMP/server/Server.Loader 2>/dev/null || true
          tar -C package -czf CyberpunkMP-linux.tar.gz CyberpunkMP

      - name: 'Upload Linux package'
        uses: actions/upload-artifact@v4
        with:
          name: CyberpunkMP-linux
          path: CyberpunkMP-linux.tar.gz
